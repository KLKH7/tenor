[project]
name = "tenor"
version = "0.1.0"
description = "TENOR (Transcripts, Evidence, Notes, Outcomes, Recall): an open benchmark for meeting note-takers, with the archived Concentrate memory system (research prototype)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "anthropic>=2.3.0",
  "mcp>=2.3.0",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=6.2.0",
  "mem0ai[nlp]>=2.2.1",
  "en-core-web-sm",
  "fastembed>=0.3.1",
  "graphiti-core[anthropic,kuzu]>=0.31.2",
  "matplotlib>=3.9",
]

[project.scripts]
tenor = "tenor.cli:app"
# Temporary alias: prints a deprecation notice, then runs the same app.
concentrate = "tenor.cli:deprecated_alias"

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/tenor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
timeout = 20

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Markdown code blocks in docs/ are hand-aligned sketches (e.g. schema shapes with aligned
# comments), not source files: the formatter checks Python files only.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["tenor", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = [
    "packages/tenor/core",
    "packages/tenor/sources",
    "packages/tenor/llm",
    "packages/tenor/synth",
    "packages/tenor/agents",
    "packages/tenor/evals",
    "packages/tenor/blackbox",
    "packages/tenor/memory",
    "packages/tenor/enhance",
    "packages/tenor/cli.py",
    "packages/tenor/watchdog.py",
    "packages/tenor/mcp_server",
    "packages/tenor/ami",
    "packages/tenor/export",
]

[[tool.mypy.overrides]]
module = ["rank_bm25", "sentence_transformers", "mem0", "mem0.*"]
ignore_missing_imports = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
